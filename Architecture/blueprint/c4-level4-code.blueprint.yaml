  - name: "LocalePreference"
    type: "Class"
    technology: "TypeScript interface/class"
    description: "locale, direction, syncState; persisted locally and synced via API-003."
  - name: "NavigationErrorEvent"
    type: "Class"
    technology: "TypeScript interface/class"
    description: "route, errorCode, timestamp, retryCount — drives error UI and telemetry."
  - name: "SessionState"
    type: "Class"
    technology: "TypeScript interface/class"
    description: "activeTabId, lastVisitedRoute, appLaunchTimestamp — persisted for session continuity."
  - name: "NavigationTabMachine"
    type: "Class"
    technology: "Redux Toolkit slice/reducer"
    description: "Implements NavigationTab state transitions (inactive <-> active) with single-active-tab guard."
  - name: "ScreenLoadMachine"
    type: "Class"
    technology: "Redux Toolkit slice/reducer"
    description: "Implements ScreenLoad transitions including throttled Retry (3x/60s) and Return-to-Home."
  - name: "LocalePreferenceMachine"
    type: "Class"
    technology: "Redux Toolkit slice/reducer"
    description: "Implements LocalePreference transitions (en<->ar) with server persist / deferred local cache / sync-on-reconnect."
  - name: "UILayoutDirectionMachine"
    type: "Class"
    technology: "Redux Toolkit slice/reducer + I18nManager"
    description: "Derives and applies LTR/RTL atomically from LocalePreference."
  - name: "ApiClient"
    type: "Class"
    technology: "Axios instance"
    description: "Centralized HTTP client implementing API-001..API-006 calls with timeout and error handling."
  - name: "PersistenceAdapter"
    type: "Class"
    technology: "AsyncStorage + react-native-keychain wrapper"
    description: "Routes non-PII vs PII/token storage to the correct device store."
  - name: "IAuditLogger"
    type: "Class"
    technology: "TypeScript interface"
    description: "Contract for logging state-transition audit events."
  - name: "TelemetryAuditLogger"
    type: "Class"
    technology: "TypeScript class implementing IAuditLogger"
    description: "Forwards audit events to the Error/Crash Telemetry Service, PII-free."
